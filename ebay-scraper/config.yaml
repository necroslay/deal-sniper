# =============================================================================
# eBay Canada Scraper — Configuration
# =============================================================================

# ── Search & Listing Type ────────────────────────────────────────────────────
search:
  base_url: "https://www.ebay.ca"
  # Active listings URL template
  url_template: "https://www.ebay.ca/sch/i.html?_nkw={search_term}&_sacat=0&LH_PrefLoc=2&rt=nc"
  # Completed/sold listings URL template (for comp valuation)
  sold_url_template: "https://www.ebay.ca/sch/i.html?_nkw={search_term}&LH_Sold=1&LH_Complete=1&LH_PrefLoc=2&rt=nc"
  default_search_term: "rtx 4090"
  default_pages: 5
  listings_per_page: 60

# ── Request Behaviour ────────────────────────────────────────────────────────
request:
  page_delay: 2.0
  timeout: 30
  max_retries: 3
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-CA,en-US;q=0.7,en;q=0.3"
    Referer: "https://www.ebay.ca/"
    DNT: "1"
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
