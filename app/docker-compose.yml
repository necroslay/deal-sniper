version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resale_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    restart: unless-stopped
  api:
    build: .
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on: [redis, postgres]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/resale_engine
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
volumes:
  pgdata: