# =============================================================================
# Facebook Marketplace Scraper — Configuration
# =============================================================================
# Centralises tunable parameters. Change values here instead of editing source.

# ── Search & Location ────────────────────────────────────────────────────────
search:
  base_url: "https://www.facebook.com"
  url_template: "https://www.facebook.com/marketplace/{location}/search?query={search_term}"
  default_search_term: "graphics card"
  default_location: "toronto"
  default_pages: 5
  listings_per_page: 24

# ── Authentication ───────────────────────────────────────────────────────────
# Export your Facebook session cookies (after logging in manually) to the
# cookie_file path. The scraper uses these to authenticate Marketplace requests.
auth:
  cookie_file: "fb_cookies.json"
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# ── Request Behaviour ────────────────────────────────────────────────────────
request:
  page_delay: 3.0
  timeout: 30
  max_retries: 3
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-CA,en-US;q=0.7,en;q=0.3"
    Referer: "https://www.facebook.com/"
    DNT: "1"
